{% extends "base.html" %}

{% block title %}Choose a new password · Present{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
    <h1 class="text-2xl font-semibold tracking-tight">Choose a new password</h1>
    {% if validlink %}
      <form method="post" class="card mt-6 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary w-full">Set password</button>
      </form>
    {% else %}
      <p class="mt-3 text-zinc-600">This reset link is invalid or has expired. Request a new one.</p>
    {% endif %}
  </div>
{% endblock %}
