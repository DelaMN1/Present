{% extends "base.html" %}

{% block title %}Change password · Present{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
    <h1 class="text-2xl font-semibold tracking-tight">Change password</h1>
    <form method="post" class="card mt-6 space-y-4">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="text-sm text-red-700">{{ form.non_field_errors }}</div>
      {% endif %}
      {% for field in form %}
        <div>
          <label class="mb-1 block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button type="submit" class="btn-primary w-full">Update password</button>
    </form>
  </div>
{% endblock %}
