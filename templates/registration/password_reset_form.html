{% extends "base.html" %}

{% block title %}Reset password · Present{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
    <h1 class="text-2xl font-semibold tracking-tight">Reset password</h1>
    <p class="mt-2 text-sm text-zinc-600">
      Enter your university email. If an account exists, we will send reset instructions.
    </p>
    <form method="post" class="card mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="mb-1 block text-sm font-medium" for="{{ form.email.id_for_label }}">Email</label>
        {{ form.email }}
        {{ form.email.errors }}
      </div>
      <button type="submit" class="btn-primary w-full">Send reset link</button>
    </form>
  </div>
{% endblock %}
