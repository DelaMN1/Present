<div id="start-attendance-modal" class="fixed inset-0 z-40 hidden items-end justify-center p-4 sm:items-center" data-modal>
  <div class="modal-backdrop absolute inset-0" data-modal-close="start-attendance-modal"></div>
  <div class="modal-panel relative" role="dialog" aria-modal="true" aria-labelledby="start-attendance-title">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 id="start-attendance-title" class="text-lg font-semibold tracking-tight">Start attendance</h2>
        <p class="mt-1 text-sm font-medium text-brand-600" data-session-code></p>
        <p class="text-sm text-slate-500" data-session-name></p>
      </div>
      <button type="button" class="btn-ghost h-11 w-11 p-0" data-modal-close="start-attendance-modal" aria-label="Close">
        {% include "partials/icon.html" with name="x" class="h-5 w-5" %}
      </button>
    </div>

    <form id="start-session-form" method="get" action="" class="mt-6 space-y-6">
      <div>
        <p class="text-sm font-medium">Session duration</p>
        <div class="mt-2 flex flex-wrap gap-2" data-chip-group>
          <input type="hidden" name="duration" value="10" />
          <button type="button" class="chip" data-chip="5">5 min</button>
          <button type="button" class="chip chip-active" data-chip="10">10 min</button>
          <button type="button" class="chip" data-chip="15">15 min</button>
          <button type="button" class="chip" data-chip="20">20 min</button>
        </div>
      </div>

      <div>
        <p class="text-sm font-medium">Attendance radius</p>
        <div class="mt-2 flex flex-wrap gap-2" data-chip-group>
          <input type="hidden" name="radius" value="100" />
          <button type="button" class="chip" data-chip="50">50m</button>
          <button type="button" class="chip chip-active" data-chip="100">100m</button>
          <button type="button" class="chip" data-chip="150">150m</button>
          <button type="button" class="chip" data-chip="200">200m</button>
        </div>
      </div>

      <div>
        <p class="text-sm font-medium">Your location</p>
        <div class="mt-2 rounded-[10px] border border-line bg-slate-50 px-4 py-3" data-location-status>
          <span class="text-slate-500">Checking this device…</span>
          <p class="mt-1 text-sm text-slate-500">Students must be within the selected radius to check in.</p>
        </div>
      </div>

      <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button type="button" class="btn-secondary" data-modal-close="start-attendance-modal">Cancel</button>
        <button type="submit" class="btn-primary">Start session</button>
      </div>
    </form>
  </div>
</div>
