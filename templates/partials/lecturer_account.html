<div class="mt-auto border-t border-white/10 px-4 py-4">
  <div class="flex items-center gap-3">
    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-white/10 text-sm font-semibold">{{ user_initials }}</span>
    <div class="min-w-0">
      <p class="truncate text-sm font-medium">{{ user.display_name }}</p>
      <p class="text-xs text-slate-400">Lecturer</p>
    </div>
  </div>
  <form method="post" action="{% url 'logout' %}" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="inline-flex items-center gap-2 text-sm text-slate-400 transition hover:text-white">
      {% include "partials/icon.html" with name="logout" class="h-4 w-4" %}
      Log out
    </button>
  </form>
</div>
