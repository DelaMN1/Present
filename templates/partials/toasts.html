{% if messages %}
  <div id="toast-root" class="pointer-events-none fixed right-4 top-4 z-50 flex w-[min(100%-2rem,22rem)] flex-col gap-2">
    {% for message in messages %}
      <div class="toast" data-toast data-timeout="5000" role="status">
        <span class="mt-0.5 text-emerald-600">{% include "partials/icon.html" with name="check" class="h-4 w-4" %}</span>
        <p class="flex-1 text-slate-700">{{ message }}</p>
        <button type="button" class="btn-ghost h-8 w-8 min-h-0 p-0" data-toast-close aria-label="Dismiss">
          {% include "partials/icon.html" with name="x" class="h-4 w-4" %}
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
