{% extends "base.html" %}

{% block title %}Present{% endblock %}

{% block content %}
  <div class="mx-auto max-w-xl py-8 sm:py-16">
    <p class="text-sm font-semibold uppercase tracking-wide text-brand-600">Start. Scan. Present.</p>
    <h1 class="mt-3 text-4xl font-semibold tracking-tight sm:text-5xl">Mark that you are here.</h1>
    <p class="mt-4 text-lg text-slate-600">
      Lecturers start a session. Students scan a QR code. Present records who came.
    </p>
    <div class="mt-8 flex flex-wrap gap-3">
      <a class="btn-primary" href="{% url 'register_student' %}">I am a student</a>
      <a class="btn-secondary" href="{% url 'register_lecturer' %}">I am a lecturer</a>
    </div>
    <p class="mt-6 text-sm text-slate-500">
      Already have an account?
      <a class="font-semibold text-brand-600 hover:text-brand-700" href="{% url 'login' %}">Log in</a>
    </p>
  </div>
{% endblock %}
