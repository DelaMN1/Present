{% extends "base.html" %}

{% block title %}Present{% endblock %}

{% block content %}
  <div class="mx-auto max-w-xl py-12">
    <p class="text-sm font-medium uppercase tracking-wide text-zinc-500">Attendance, simply</p>
    <h1 class="mt-3 text-4xl font-semibold tracking-tight">Mark that you are here.</h1>
    <p class="mt-4 text-lg text-zinc-600">
      Lecturers start a session. Students scan a QR code. Present records who came.
    </p>
    <div class="mt-8 flex flex-wrap gap-3">
      <a class="btn-primary" href="{% url 'register_student' %}">I am a student</a>
      <a class="btn-secondary" href="{% url 'register_lecturer' %}">I am a lecturer</a>
    </div>
    <p class="mt-6 text-sm text-zinc-500">
      Already have an account?
      <a class="font-medium text-zinc-900 underline" href="{% url 'login' %}">Log in</a>
    </p>
  </div>
{% endblock %}
